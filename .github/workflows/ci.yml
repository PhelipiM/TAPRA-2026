name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.10"
      #     cache: "pip"

      # - name: Install dependencies
      #   run: |
      #     python3 -m pip install --upgrade pip
      #     pip install ruff

      # - name: Check code formatting and linting
      #   run: |
      #     ruff format --check .
      #     ruff check --select I .
      #     ruff check .

      - run: python3 --version
      - run: python3 -m py_compile function_app.py
  
  deploy:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: 'azfunc-PHELIPI'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME}}
          package: .
          remote-build: true
